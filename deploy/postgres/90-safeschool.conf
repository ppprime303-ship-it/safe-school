# /etc/postgresql/16/main/conf.d/90-safeschool.conf — 2GB VPS, 앱 1개(Ubuntu 기본 postgresql.conf 가 conf.d 를 읽음)
# 적용: sudo systemctl restart postgresql   확인: sudo -u postgres psql -c "SHOW listen_addresses"

# 외부 인터넷에서 접속 불가: 같은 서버(루프백)에서만 받음. 방화벽(ufw)에서도 5432를 열지 않음
listen_addresses = 'localhost'
port = 5432
password_encryption = 'scram-sha-256'

# 메모리(2GB 서버: PostgreSQL 약 400~500MB 목표). 실측 후 조정
max_connections = 30
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
huge_pages = off

# 로그에 개인정보(교직원 이메일 등 SQL 값)를 남기지 않음
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = panic
log_error_verbosity = terse
log_connections = off
log_disconnections = off

# 오래 끄는 연결·트랜잭션 정리
idle_in_transaction_session_timeout = '60s'
statement_timeout = '30s'
