name: Verify School Registration Withdrawal
on:
  push:
    branches:
      - feature/school-registration-withdrawal
      - integration/registration-withdrawal
      - integration/production-preservation
      - beta/pilot-2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: safeschool_ci
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: safeschool_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeschool_ci -d safeschool_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://safeschool_ci:test-only-ci-password@127.0.0.1:5432/safeschool_ci?schema=safeschool_test
      TEST_DATABASE_URL: postgresql://safeschool_ci:test-only-ci-password@127.0.0.1:5432/safeschool_ci?schema=safeschool_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies with retry and diagnostics
        env:
          npm_config_registry: https://registry.npmjs.org
        shell: bash
        run: |
          npm config set fetch-retries 2
          for n in 1 2; do
            if npm ci --legacy-peer-deps --no-audit --no-fund --loglevel warn; then exit 0; fi
            echo "Dependency installation attempt $n failed"
            if [ "$n" = 2 ]; then
              find "$HOME/.npm/_logs" -name '*debug-0.log' -type f -print -exec tail -n 50 {} \; || true
              exit 1
            fi
            npm cache clean --force || true
          done
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
